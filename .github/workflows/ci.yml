name: CI

# Manual only. This repo is private, so macOS runner minutes come out of the
# monthly Actions allowance at 10x the Linux rate. Releases are built by Xcode
# Cloud from the testflight branch (see ci_scripts/). Run this by hand from
# the Actions tab when you want a full check across all platforms.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: CFSpeedKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        working-directory: Packages/CFSpeedKit
        # The live integration test skips itself unless CF_SPEEDTEST_LIVE=1,
        # so CI never sends speed-test traffic.
        run: swift test

  engine-simulators:
    name: CFSpeedKit tests (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            device: iPhone
          - platform: tvOS
            device: Apple TV
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        working-directory: Packages/CFSpeedKit
        # Use whichever matching simulator the runner image ships rather than
        # hard-coding a model name that changes between Xcode releases.
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          rt = "${{ matrix.platform }}"
          devs = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for k, v in sorted(devs.items(), reverse=True) if f".{rt}-" in k
                 for d in v if d["name"].startswith("${{ matrix.device }}")]
          print(ids[0])')
          # Boot first: a simulator still booting freezes the first seconds of
          # the test run and trips the timing assertions.
          xcrun simctl boot "$id" || true
          xcrun simctl bootstatus "$id" -b
          xcodebuild test \
            -scheme CFSpeedKit \
            -destination "platform=${{ matrix.platform }} Simulator,id=$id"

  apps:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: CFSpeed
            destination: generic/platform=iOS Simulator
          - scheme: CFSpeed-tvOS
            destination: generic/platform=tvOS Simulator
          - scheme: CFSpeed-macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project CFSpeed.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO
