name: CFSpeed
options:
  bundleIdPrefix: me.aashishvanand.speed
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true

packages:
  CFSpeedKit:
    path: Packages/CFSpeedKit

targets:
  CFSpeed:
    type: application
    platform: iOS
    sources:
      - path: App/CFSpeed
      - path: App/Shared
    info:
      path: App/CFSpeed/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: CFSpeed
        PRODUCT_BUNDLE_IDENTIFIER: me.aashishvanand.speed.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67Z8KU7B9Q
    dependencies:
      - package: CFSpeedKit

  CFSpeed-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: App/CFSpeed-tvOS
      - path: App/Shared
    info:
      path: App/CFSpeed-tvOS/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: CFSpeed
        PRODUCT_BUNDLE_IDENTIFIER: me.aashishvanand.speed.tvos
        SWIFT_VERSION: 5.10
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67Z8KU7B9Q
    dependencies:
      - package: CFSpeedKit

schemes:
  CFSpeed:
    build:
      targets:
        CFSpeed: all
    run:
      config: Debug
  CFSpeed-tvOS:
    build:
      targets:
        CFSpeed-tvOS: all
    run:
      config: Debug
