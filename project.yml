name: CFSpeed
options:
  bundleIdPrefix: me.aashishvanand.speed
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  CFSpeedKit:
    path: Packages/CFSpeedKit

targets:
  CFSpeed:
    type: application
    platform: iOS
    sources:
      - path: App/CFSpeed
      - path: App/Shared
    info:
      path: App/CFSpeed/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Edge Speed
        PRODUCT_MODULE_NAME: CFSpeed
        PRODUCT_BUNDLE_IDENTIFIER: me.aashishvanand.speed
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 67Z8KU7B9Q
    dependencies:
      - package: CFSpeedKit

  CFSpeed-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: App/CFSpeed-tvOS
      - path: App/Shared
    info:
      path: App/CFSpeed-tvOS/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Edge Speed
        PRODUCT_MODULE_NAME: CFSpeed
        PRODUCT_BUNDLE_IDENTIFIER: me.aashishvanand.speed
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 67Z8KU7B9Q
    dependencies:
      - package: CFSpeedKit

  CFSpeed-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/CFSpeed-macOS
      - path: App/Shared
    info:
      path: App/CFSpeed-macOS/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: App/CFSpeed-macOS/CFSpeed-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: Edge Speed
        PRODUCT_MODULE_NAME: CFSpeed
        PRODUCT_BUNDLE_IDENTIFIER: me.aashishvanand.speed
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 67Z8KU7B9Q
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: CFSpeedKit

schemes:
  CFSpeed:
    build:
      targets:
        CFSpeed: all
    run:
      config: Debug
  CFSpeed-tvOS:
    build:
      targets:
        CFSpeed-tvOS: all
    run:
      config: Debug
  CFSpeed-macOS:
    build:
      targets:
        CFSpeed-macOS: all
    run:
      config: Debug
